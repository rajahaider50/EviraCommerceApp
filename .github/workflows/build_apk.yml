name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK and ZIP
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/EviraCommerceApp-v2.0.0.apk
          cd release-output
          zip EviraCommerceApp-v2.0.0-APK.zip EviraCommerceApp-v2.0.0.apk
          cd ..

      - name: Upload to Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          files: |
            release-output/EviraCommerceApp-v2.0.0.apk
            release-output/EviraCommerceApp-v2.0.0-APK.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
